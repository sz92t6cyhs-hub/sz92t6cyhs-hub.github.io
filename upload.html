<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写真を登録 - 写探</title>
<style>
  :root { --bg:#12110f; --fg:#f4f0e8; --accent:#c44722; --muted:#8a8478; --card:#1c1a17; --border:#2e2b27; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; min-height:100vh; padding:24px; }
  .wrap { max-width:640px; margin:0 auto; }
  .wordmark { font-size:1.4rem; font-weight:700; letter-spacing:0.15em; margin-bottom:24px; }
  .wordmark span { color:var(--accent); }
  .wordmark a { color:inherit; text-decoration:none; }
  h1 { font-size:1.3rem; margin-bottom:8px; }
  .sub { color:var(--muted); font-size:0.9rem; margin-bottom:24px; }
  .pick {
    display:block; width:100%; text-align:center;
    background:var(--accent); color:var(--fg);
    font-size:1.15rem; font-weight:700; padding:28px 16px;
    border-radius:4px; letter-spacing:0.05em;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .native { display:block; width:100%; margin-top:10px; padding:12px; font-size:1rem; color:var(--fg); background:var(--card); border:1px solid var(--border); border-radius:4px; }
  .preview { margin-top:20px; display:none; }
  .preview img { width:100%; max-height:420px; object-fit:contain; background:#000; border-radius:4px; }
  .meta { margin-top:8px; color:var(--muted); font-size:0.85rem; }
  .btn { display:block; width:100%; margin-top:16px; background:var(--accent); color:var(--fg); border:none; font-size:1rem; font-weight:700; padding:16px; border-radius:4px; cursor:pointer; }
  .btn:disabled { background:var(--border); }
  .status { margin-top:12px; color:var(--muted); font-size:0.9rem; min-height:1.2em; }
  .ok { color:#7ec8a3; }
  .err { color:#e07060; }
  .item { background:var(--card); border:1px solid var(--border); border-radius:4px; padding:12px 16px; margin-top:8px; font-size:0.9rem; }
  .tag { color:var(--accent); font-size:0.75rem; letter-spacing:0.08em; }
  .note { margin-top:28px; color:var(--muted); font-size:0.75rem; line-height:1.6; }
  a.back { color:var(--muted); font-size:0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark"><a href="index.html">写<span>探</span></a></div>
  <h1>写真を登録</h1>
  <p class="sub">下のボタンをタップすると、写真を選べます。</p>
  <label class="pick" for="fileInput">写真を選ぶ</label>
  <input id="fileInput" class="native" type="file" accept="image/*">
  <div class="preview" id="preview">
    <img id="previewImg" alt="プレビュー">
    <div class="meta" id="meta"></div>
  </div>
  <div style="margin-top:16px">
    <label for="apiKey" style="color:var(--muted);font-size:0.9rem">Gemini APIキー（この端末内にだけ保存）</label>
    <input id="apiKey" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ここにAPIキーを貼り付け" style="display:block;width:100%;margin-top:6px;padding:14px;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:4px">
    <button id="saveKey" type="button" style="display:block;width:100%;margin-top:8px;background:var(--card);color:var(--fg);border:1px solid var(--border);font-size:1rem;font-weight:700;padding:12px;border-radius:4px">キーを保存</button>
    <div id="keyStatus" style="margin-top:6px;color:var(--muted);font-size:0.85rem"></div>
  </div>
  <button class="btn" id="go" type="button" disabled>特徴を検出する</button>
  <div class="status" id="status"></div>
  <div id="list"></div>
  <p class="note">検出には Gemini の API キーが必要です。キーはこの端末の中にだけ保存されます。</p>
  <p class="note"><a class="back" href="index.html">検索に戻る</a></p>
</div>
<script>
(function () {
  var input = document.getElementById("fileInput");
  var preview = document.getElementById("preview");
  var img = document.getElementById("previewImg");
  var meta = document.getElementById("meta");
  var go = document.getElementById("go");
  var statusEl = document.getElementById("status");
  var list = document.getElementById("list");
  var current = null;

  // 小さなサムネイル（長辺240px, JPEG）を作ってブラウザ内に保存する
  function makeThumb() {
    try {
      var max = 240, w = img.naturalWidth, h = img.naturalHeight;
      var s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement("canvas");
      c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", 0.7);
    } catch (e) { return null; }
  }

  function onPick() {
    var src = this;
    if (!src.files || !src.files.length) return;
    current = src.files[0];
    var reader = new FileReader();
    reader.onload = function (e) {
      img.src = e.target.result;
      preview.style.display = "block";
      meta.textContent = current.name;
      go.disabled = false;
      statusEl.textContent = "";
      list.innerHTML = "";
    };
    reader.readAsDataURL(current);
  }
  input.addEventListener("change", onPick);

  go.addEventListener("click", function () {
    if (!current) return;
    var key = localStorage.getItem("gemini_api_key");
    if (!key) { alert("先に上の欄にGemini APIキーを貼って「キーを保存」を押してください"); return; }
    localStorage.setItem("gemini_api_key", key);
    go.disabled = true;
    statusEl.className = "status";
    statusEl.textContent = "解析中";
    var reader = new FileReader();
    reader.onload = function (e) {
      var b64 = String(e.target.result).split(",")[1];
      var prompt = "この写真に写っている人の特徴を、小さく薄いものも含めて一つ残らず検出してください。対象: ほくろ（周りより暗い小さな点も含む）、傷・傷あと、シミ、顔の特徴、文字、アクセサリー。ほくろは一つずつ別の項目にし、説明には「左頬の小さなほくろ」「右目の下2cmのほくろ」のように顔や体のどこにあるかを日本語で具体的に書いてください。毛穴や影は除外。JSONだけ返してください。形式: {\"features\":[{\"label\":\"mole|scar|spot|face|text|accessory\",\"description\":\"説明\",\"confidence\":0.9}]}";
      // 送る画像は長辺1600pxのJPEGに縮小（HEICや大きすぎる写真でのエラーを防ぐ）
      try {
        var mx = 1600, sc = Math.min(1, mx / Math.max(img.naturalWidth, img.naturalHeight));
        var cc = document.createElement("canvas");
        cc.width = Math.round(img.naturalWidth * sc); cc.height = Math.round(img.naturalHeight * sc);
        cc.getContext("2d").drawImage(img, 0, 0, cc.width, cc.height);
        b64 = cc.toDataURL("image/jpeg", 0.9).split(",")[1];
      } catch (ce) {}
      var body = JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }],
        generationConfig: { responseMimeType: "application/json" } });
      var models = ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-2.5-flash"];
      function fail(msg) { statusEl.className = "status err"; statusEl.textContent = msg; go.disabled = false; }
      function tryModel(k) {
        var model = models[k];
        fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-goog-api-key": key.trim() },
          body: body
        }).then(function (r) { return r.json().then(function (data) { return { status: r.status, data: data }; }); })
        .then(function (res) {
          var data = res.data;
          if (data.error) {
            if ((res.status === 404 || res.status === 429) && k + 1 < models.length) { tryModel(k + 1); return; }
            fail("エラー " + res.status + " (" + (data.error.status || "") + "): " + (data.error.message || ""));
            return;
          }
          var c = data.candidates && data.candidates[0];
          if (!c || !c.content || !c.content.parts) {
            fail("Geminiが結果を返しませんでした（" + ((c && c.finishReason) || (data.promptFeedback && data.promptFeedback.blockReason) || "理由不明") + "）");
            return;
          }
          var text = c.content.parts.map(function (p) { return p.text || ""; }).join("");
          text = text.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/```\s*$/i, "").trim();
          var result; try { result = JSON.parse(text); } catch (pe) { fail("結果の読み取りに失敗しました: " + text.slice(0, 120)); return; }
          var features = result.features || [];
          list.innerHTML = "";
          features.forEach(function (f) {
            var d = document.createElement("div");
            d.className = "item";
            var tag = document.createElement("div"); tag.className = "tag"; tag.textContent = f.label || "other";
            d.appendChild(tag); d.appendChild(document.createTextNode(f.description || ""));
            list.appendChild(d);
          });
          var db = JSON.parse(localStorage.getItem("shatan_db") || "[]");
          db.push({ filename: current.name, features: features, thumb: makeThumb(), ts: Date.now() });
          try { localStorage.setItem("shatan_db", JSON.stringify(db)); }
          catch (qe) { db[db.length - 1].thumb = null; localStorage.setItem("shatan_db", JSON.stringify(db)); }
          statusEl.className = "status ok";
          statusEl.textContent = features.length + " 件を保存しました（" + model + "）";
          go.disabled = false;
        }).catch(function (err) { fail("通信エラー: " + err.message + "（ネット接続か、ブラウザの通信制限の可能性）"); });
      }
      tryModel(0);
    };
    reader.readAsDataURL(current);
  });

  (function () {
    var kin = document.getElementById("apiKey"), ks = document.getElementById("keyStatus");
    function show() { ks.textContent = localStorage.getItem("gemini_api_key") ? "キー保存済み（変えるときは新しいキーを貼って保存）" : "キーがまだ保存されていません"; }
    document.getElementById("saveKey").addEventListener("click", function () {
      var v = kin.value.replace(/\s+/g, "");
      if (!v) { ks.textContent = "キーが空です"; return; }
      localStorage.setItem("gemini_api_key", v); kin.value = ""; show();
    });
    show();
  })();
})();
</script>
</body>
</html>

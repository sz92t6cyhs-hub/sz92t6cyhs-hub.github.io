<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写真を登録 - 写探 Shatan</title>
<style>
  body { background: #12110f; color: #f4f0e8; font-family: -apple-system, sans-serif; padding: 24px; }
  .card { max-width: 640px; margin: 0 auto; background: #1c1a17; border: 1px solid #2e2b27; border-radius: 4px; padding: 32px; }
  h1 { font-size: 1.3rem; margin-bottom: 8px; }
  .sub { color: #8a8478; font-size: 0.9rem; margin-bottom: 28px; }
  .pick { display: block; width: 100%; background: #c44722; color: #f4f0e8; border: none; font-size: 1.1rem; padding: 20px; border-radius: 4px; font-weight: 600; cursor: pointer; }
  .pick:active { background: #d4522a; }
  .preview { margin-top: 24px; display: none; }
  .preview img { width: 100%; max-height: 400px; object-fit: contain; background: #000; border-radius: 4px; }
  .preview .meta { margin-top: 12px; color: #8a8478; font-size: 0.85rem; }
  .btn { display: block; width: 100%; margin-top: 24px; background: #c44722; border: none; color: #f4f0e8; font-size: 1rem; padding: 16px; border-radius: 4px; cursor: pointer; font-weight: 600; }
  .btn:disabled { background: #2e2b27; cursor: not-allowed; }
  .status { margin-top: 16px; font-size: 0.9rem; color: #8a8478; min-height: 1.4em; }
  .status.error { color: #e07060; }
  .status.ok { color: #7ec8a3; }
  .features { margin-top: 24px; }
  .features h2 { font-size: 0.85rem; color: #8a8478; margin-bottom: 12px; }
  .feature-item { background: #12110f; border: 1px solid #2e2b27; border-radius: 4px; padding: 12px 16px; margin-bottom: 8px; font-size: 0.9rem; }
  .feature-item .tag { color: #c44722; font-size: 0.75rem; }
  .note { margin-top: 32px; color: #8a8478; font-size: 0.75rem; line-height: 1.6; max-width: 640px; margin-left: auto; margin-right: auto; }
  .back { color: #8a8478; font-size: 0.9rem; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>写真を登録</h1>
    <p class="sub">写真を選ぶと、AIが特徴を自動で検出して検索できるようにします。</p>

    <label class="pick" for="fileInput">写真を選ぶ</label>
    <input type="file" id="fileInput" accept="image/*" style="display:none">

    <div class="preview" id="preview">
      <img id="previewImg">
      <div class="meta" id="previewMeta"></div>
    </div>

    <button class="btn" id="analyzeBtn" disabled>特徴を検出する</button>
    <div class="status" id="status"></div>
    <div class="features" id="features"></div>
  </div>

  <div class="note">検出には Gemini Vision API が必要です。デモ版ではキー入力が必要です。<br><a class="back" href="index.html">&larr; 検索に戻る</a></div>

<script>
  var fileInput = document.getElementById('fileInput');
  var preview = document.getElementById('preview');
  var previewImg = document.getElementById('previewImg');
  var previewMeta = document.getElementById('previewMeta');
  var analyzeBtn = document.getElementById('analyzeBtn');
  var statusEl = document.getElementById('status');
  var featuresEl = document.getElementById('features');
  var currentFile = null;

  fileInput.addEventListener('change', function() {
    if (!fileInput.files.length) return;
    var file = fileInput.files[0];
    currentFile = file;
    var reader = new FileReader();
    reader.onclick = null;
    reader.onload = function(e) {
      previewImg.src = e.target.result;
      preview.style.display = 'block';
      previewMeta.textContent = file.name + ' / ' + Math.round(file.size / 1024) + ' KB';
      analyzeBtn.disabled = false;
      statusEl.textContent = '';
      featuresEl.innerHTML = '';
    };
    reader.readAsDataURL(file);
  });

  analyzeBtn.addEventListener('click', function() {
    if (!currentFile) return;
    var apiKey = localStorage.getItem('gemini_api_key') || prompt('ジェミニ API キーを入力してください（ブラウザに保存されます）: ');
    if (!apiKey) return;
    localStorage.setItem('gemini_api_key', apiKey);

    analyzeBtn.disabled = true;
    statusEl.textContent = '解析中...';
    statusEl.className = 'status';

    var reader = new FileReader();
    reader.onclick = null;
    reader.onload = function(e) {
      var base64 = e.target.result.split(',')[1];
      var prompt = 'この写真を分析してください。皮腔上のほくろ・シミ・色素沉淀、顔の特徴（目・看・鼻・口・輪郭）、写っているテキスト、その他の注目特徴をすべて検出し、それぞれの位置を bounding box で示してください。出力は JSON のみ。形式: {"features":[{"label":"mole"|"spot"|"scar"|"face"|"text"|"other","bbox":[x_min,y_min,x_max,y_max],"confidence":0.0-1.0,"description":"特徴の説明"}]}。bbox の座標は画像の幅・高さに対する正規化値（0-1）で、左上が (0,0)、右下が (1,1) です。特徴が見つからない場合は {"features":[]} を返してください。';

      fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=' + apiKey, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify([
          { parts: [{ text: prompt }, { inline_data: { mime_type: currentFile.type || 'image/jpeg', data: base64 } }] }
        ])
      })
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (data.error) {
          statusEl.textContent = 'エラー: ' + (data.error.message || JSON.stringify(data.error));
          statusEl.className = 'status error';
          analyzeBtn.disabled = false;
          return;
        }
        var text = data.candidates[0].content.parts[0].text;
        if (text.indexOf('```') === 0) {
          var lines = text.split('\n);
          text = lines.slice(1, lines[lines.length-1] === '```' ? -1 : undefined).join('\n);
        }
        var result = JSON.parse(text);
        showFeatures(result.features || []);
        statusEl.textContent = (result.features || []).length + ' 件の特徴を検出しました';
        statusEl.className = 'status ok';
        saveToSearch(result.features || [], currentFile.name);
      })
      .catch(function(err) {
        statusEl.textContent = '通信エラー: ' + err.message;
        statusEl.className = 'status error';
        analyzeBtn.disabled = false;
      });
    };
    reader.readAsDataURL(currentFile);
  });

  function showFeatures(features) {
    featuresEl.innerHTML = '<h2>検出された特徴</h2>';
    if (!features.length) {
      featuresEl.innerHTML += '<div class="feature-item">特徴は見つかりませんでした</div>';
      return;
    }
    features.forEach(function(f) {
      var div = document.createElement('div);
      div.className = 'feature-item';
      div.innerHTML = '<div class="tag">' + (f.label || 'other').toUpperCase() + ' / 信頼度 ' + Math.round((f.confidence || 0) * 100) + '%</div>' + (f.description || '');
      featuresEl.appendChild(div);
    });
  }

  function saveToSearch(features, filename) {
    var db = JSON.parse(localStorage.getItem('shatan_db') || '[]);
    db.push({ filename: filename, features: features, ts: Date.now() });
    localStorage.setItem('shatan_db', JSON.stringify(db));
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写真を登録 - 写探</title>
<style>
  :root { --bg:#12110f; --fg:#f4f0e8; --accent:#c44722; --muted:#8a8478; --card:#1c1a17; --border:#2e2b27; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; min-height:100vh; padding:24px; }
  .wrap { max-width:640px; margin:0 auto; }
  .wordmark { font-size:1.4rem; font-weight:700; letter-spacing:0.15em; margin-bottom:24px; }
  .wordmark span { color:var(--accent); }
  .wordmark a { color:inherit; text-decoration:none; }
  h1 { font-size:1.3rem; margin-bottom:8px; }
  .sub { color:var(--muted); font-size:0.9rem; margin-bottom:24px; }
  .pick {
    display:block; width:100%; text-align:center;
    background:var(--accent); color:var(--fg);
    font-size:1.15rem; font-weight:700; padding:28px 16px;
    border-radius:4px; letter-spacing:0.05em;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .pick input { position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  .preview { margin-top:20px; display:none; }
  .preview img { width:100%; max-height:420px; object-fit:contain; background:#000; border-radius:4px; }
  .meta { margin-top:8px; color:var(--muted); font-size:0.85rem; }
  .btn { display:block; width:100%; margin-top:16px; background:var(--accent); color:var(--fg); border:none; font-size:1rem; font-weight:700; padding:16px; border-radius:4px; cursor:pointer; }
  .btn:disabled { background:var(--border); }
  .status { margin-top:12px; color:var(--muted); font-size:0.9rem; min-height:1.2em; }
  .ok { color:#7ec8a3; }
  .err { color:#e07060; }
  .item { background:var(--card); border:1px solid var(--border); border-radius:4px; padding:12px 16px; margin-top:8px; font-size:0.9rem; }
  .tag { color:var(--accent); font-size:0.75rem; letter-spacing:0.08em; }
  .note { margin-top:28px; color:var(--muted); font-size:0.75rem; line-height:1.6; }
  a.back { color:var(--muted); font-size:0.9rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark"><a href="index.html">写<span>探</span></a></div>
  <h1>写真を登録</h1>
  <p class="sub">下のボタンをタップすると、写真を選べます。</p>
  <label class="pick" for="fileInput">写真を選ぶ
    <input id="fileInput" type="file" accept="image/*" capture="environment">
  </label>
  <div class="preview" id="preview">
    <img id="previewImg" alt="プレビュー">
    <div class="meta" id="meta"></div>
  </div>
  <button class="btn" id="go" type="button" disabled>特徴を検出する</button>
  <div class="status" id="status"></div>
  <div id="list"></div>
  <p class="note">検出には Gemini の API キーが必要です。キーはこの端末の中にだけ保存されます。</p>
  <p class="note"><a class="back" href="index.html">検索に戻る</a></p>
</div>
<script>
(function () {
  var input = document.getElementById("fileInput");
  var preview = document.getElementById("preview");
  var img = document.getElementById("previewImg");
  var meta = document.getElementById("meta");
  var go = document.getElementById("go");
  var statusEl = document.getElementById("status");
  var list = document.getElementById("list");
  var current = null;

  input.addEventListener("change", function () {
    if (!input.files || !input.files.length) return;
    current = input.files[0];
    var reader = new FileReader();
    reader.onload = function (e) {
      img.src = e.target.result;
      preview.style.display = "block";
      meta.textContent = current.name;
      go.disabled = false;
      statusEl.textContent = "";
      list.innerHTML = "";
    };
    reader.readAsDataURL(current);
  });

  go.addEventListener("click", function () {
    if (!current) return;
    var key = localStorage.getItem("gemini_api_key") || window.prompt("Gemini APIキーを入力");
    if (!key) return;
    localStorage.setItem("gemini_api_key", key);
    go.disabled = true;
    statusEl.className = "status";
    statusEl.textContent = "解析中";
    var reader = new FileReader();
    reader.onload = function (e) {
      var b64 = String(e.target.result).split(",")[1];
      var prompt = "この写真のほくろ・傷・顔・文字・アクセサリーを検出してください。JSONだけ返してください。形式: {\"features\":[{\"label\":\"mole\",\"description\":\"説明\",\"confidence\":0.9}]}";
      fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=" + encodeURIComponent(key), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: current.type || "image/jpeg", data: b64 } }] }] })
      }).then(function (r) { return r.json(); }).then(function (data) {
        if (data.error) {
          statusEl.className = "status err";
          statusEl.textContent = data.error.message || "エラー";
          go.disabled = false;
          return;
        }
        var text = data.candidates[0].content.parts[0].text;
        text = text.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/```$/i, "").trim();
        var result = JSON.parse(text);
        var features = result.features || [];
        list.innerHTML = "";
        features.forEach(function (f) {
          var d = document.createElement("div");
          d.className = "item";
          d.innerHTML = "<div class=\"tag\">" + (f.label || "other") + "</div>" + (f.description || "").replace(/</g, "<").replace(/>/g, ">").replace(/\n/g, "<br>");
          list.appendChild(d);
        });
        var db = JSON.parse(localStorage.getItem("shatan_db") || "[]");
        db.push({ filename: current.name, features: features, ts: Date.now() });
        localStorage.setItem("shatan_db", JSON.stringify(db));
        statusEl.className = "status ok";
        statusEl.textContent = features.length + " 件を保存しました";
        go.disabled = false;
      }).catch(function (err) {
        statusEl.className = "status err";
        statusEl.textContent = err.message;
        go.disabled = false;
      });
    };
    reader.readAsDataURL(current);
  });
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写探 Shatan</title>
<style>
  :root { --bg:#12110f; --fg:#f4f0e8; --accent:#c44722; --muted:#8a8478; --card:#1c1a17; --border:#2e2b27; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px; }
  .wordmark { font-size:2.4rem; font-weight:700; letter-spacing:0.15em; margin:40px 0 8px; }
  .wordmark span { color:var(--accent); }
  .tag { color:var(--muted); margin-bottom:28px; }
  form { width:100%; max-width:560px; display:flex; border:1px solid var(--border); background:var(--card); }
  input { flex:1; background:transparent; border:none; color:var(--fg); font-size:1.05rem; padding:16px; outline:none; }
  button { background:var(--accent); border:none; color:var(--fg); font-weight:700; padding:16px 20px; }
  .chips { margin-top:16px; }
  .chips button { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:20px; padding:6px 12px; margin:4px; font-weight:500; }
  #out { width:100%; max-width:560px; margin-top:28px; }
  .card { background:var(--card); border:1px solid var(--border); padding:14px 16px; margin-bottom:10px; }
  .lab { color:var(--accent); font-size:0.8rem; }
  .nav { margin-top:24px; }
  .nav a { color:var(--muted); }
  .note { margin-top:32px; color:var(--muted); font-size:0.75rem; max-width:560px; text-align:center; line-height:1.6; }
</style>
</head>
<body>
  <div class="wordmark">写<span>探</span></div>
  <div class="tag">写真の特徴で、似た写真を探す</div>
  <form id="f">
    <input id="q" type="text" placeholder="ほくろ、傷、ネックレス" autocomplete="off">
    <button type="submit">検索</button>
  </form>
  <div class="chips">
    <button type="button" data-q="ほくろ">ほくろ</button>
    <button type="button" data-q="傷">傷</button>
    <button type="button" data-q="ネックレス">ネックレス</button>
  </div>
  <div id="out"></div>
  <div class="nav"><a href="upload.html">写真を登録する</a></div>
  <p class="note">登録した写真の特徴は、この端末の中だけに保存されます。</p>
<script>
(function () {
  var form = document.getElementById("f");
  var box = document.getElementById("q");
  var out = document.getElementById("out");

  function search(raw) {
    var q = String(raw || "").trim().toLowerCase();
    out.innerHTML = "";
    if (!q) return;
    var db = [];
    try { db = JSON.parse(localStorage.getItem("shatan_db") || "[]"); } catch (e) { db = []; }
    var hits = [];
    db.forEach(function (entry) {
      (entry.features || []).forEach(function (f) {
        var hay = ((f.label || "") + " " + (f.description || "")).toLowerCase();
        if (hay.indexOf(q) !== -1) hits.push({ filename: entry.filename, feature: f });
      });
    });
    if (!hits.length) {
      out.innerHTML = "<div class=\"card\"><div class=\"lab\">結果なし</div>「" + q + "」はまだ登録されていません。</div>";
      return;
    }
    hits.forEach(function (h) {
      var d = document.createElement("div");
      d.className = "card";
      d.innerHTML = "<div class=\"lab\">" + (h.feature.label || "other") + "</div>" + (h.feature.description || "") + "<div class=\"tag\">" + (h.filename || "") + "</div>";
      out.appendChild(d);
    });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    search(box.value);
  });
  var chips = document.querySelectorAll("[data-q]");
  for (var i = 0; i < chips.length; i++) {
    chips[i].addEventListener("click", function () {
      box.value = this.getAttribute("data-q");
      search(box.value);
    });
  }
  var params = new URLSearchParams(location.search);
  var q = params.get("q");
  if (q) { box.value = q; search(q); }
})();
</script>
</body>
</html>

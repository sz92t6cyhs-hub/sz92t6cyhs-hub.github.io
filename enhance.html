<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写探 補正 - ほくろを見やすく</title>
<style>
  :root { --bg:#12110f; --fg:#f4f0e8; --accent:#c44722; --muted:#8a8478; --card:#1c1a17; --border:#2e2b27; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; padding:20px; }
  .wrap { max-width:640px; margin:0 auto; }
  .wordmark { font-size:1.4rem; font-weight:700; letter-spacing:0.15em; margin-bottom:16px; }
  .wordmark span { color:var(--accent); }
  .pick { position:relative; overflow:hidden; display:block; text-align:center; background:var(--accent); font-weight:700; font-size:1.1rem; padding:22px; border-radius:4px; }
  .pick input { position:absolute; inset:0; width:100%; height:100%; opacity:0; font-size:100px; }
  canvas { display:block; width:100%; margin-top:16px; background:#000; border-radius:4px; }
  .row { margin-top:14px; }
  .row label { display:flex; justify-content:space-between; color:var(--muted); font-size:0.9rem; }
  input[type=range] { width:100%; }
  .btn { display:block; width:100%; margin-top:12px; background:var(--card); color:var(--fg); border:1px solid var(--border); font-size:1rem; font-weight:700; padding:14px; border-radius:4px; }
  .btn.main { background:var(--accent); border:none; }
  .status { margin-top:10px; color:var(--muted); font-size:0.9rem; min-height:1.2em; }
  .item { background:var(--card); border:1px solid var(--border); padding:10px 14px; margin-top:6px; font-size:0.9rem; }
  .note { margin-top:24px; color:var(--muted); font-size:0.75rem; line-height:1.6; }
  a { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">写<span>探</span> 補正</div>
  <label class="pick">写真を選ぶ<input id="file" type="file" accept="image/*"></label>
  <canvas id="cv"></canvas>
  <div class="row"><label>くっきり <span id="vS"></span></label><input id="sharp" type="range" min="0" max="8" step="0.1" value="3"></div>
  <div class="row"><label>コントラスト <span id="vC"></span></label><input id="contrast" type="range" min="0" max="5" step="0.05" value="1.5"></div>
  <div class="row"><label>ほくろ強調（暗い点を濃く） <span id="vM"></span></label><input id="mole" type="range" min="0" max="6" step="0.05" value="2.5"></div>
  <button class="btn" id="orig" type="button">押している間は元の写真</button>
  <div style="margin-top:16px">
    <label for="apiKey" style="color:var(--muted);font-size:0.9rem">Gemini APIキー（この端末内にだけ保存）</label>
    <input id="apiKey" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ここにAPIキーを貼り付け" style="display:block;width:100%;margin-top:6px;padding:14px;font-size:16px;color:var(--fg);background:var(--card);border:1px solid var(--border);border-radius:4px">
    <button id="saveKey" type="button" style="display:block;width:100%;margin-top:8px;background:var(--card);color:var(--fg);border:1px solid var(--border);font-size:1rem;font-weight:700;padding:12px;border-radius:4px">キーを保存</button>
    <div id="keyStatus" style="margin-top:6px;color:var(--muted);font-size:0.85rem"></div>
  </div>
  <button class="btn main" id="ai" type="button">Geminiでほくろに印をつける</button>
  <button class="btn" id="save" type="button">画像を保存</button>
  <div class="status" id="st"></div>
  <div id="list"></div>
  <p class="note">補正はすべてこのiPhoneのブラウザ内で行います。印つけだけはGeminiに画像を送ります。APIキーは自分で取得したものを入力し、この端末内にだけ保存されます。</p>
  <p class="note"><a href="https://sz92t6cyhs-hub.github.io/">写探に戻る</a> ／ <a href="#" id="clearKey">保存したAPIキーを消す</a></p>
</div>
<script>
(function () {
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var src = null, marks = [], showOrig = false;
  var $ = function (id) { return document.getElementById(id); };
  var st = $("st");

  $("file").addEventListener("change", function () {
    var f = this.files && this.files[0]; if (!f) return;
    var im = new Image();
    im.onload = function () {
      var max = 1600, s = Math.min(1, max / Math.max(im.width, im.height));
      cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      ctx.drawImage(im, 0, 0, cv.width, cv.height);
      src = ctx.getImageData(0, 0, cv.width, cv.height);
      marks = []; $("list").innerHTML = ""; render();
    };
    im.src = URL.createObjectURL(f);
  });

  // 3x3 ぼかし（グレー）
  function blurLum(L, w, h, r) {
    var tmp = new Float32Array(L.length), out = new Float32Array(L.length), x, y, k, s, n;
    for (y = 0; y < h; y++) for (x = 0; x < w; x++) { s = 0; n = 0;
      for (k = -r; k <= r; k++) { var xx = x + k; if (xx >= 0 && xx < w) { s += L[y * w + xx]; n++; } } tmp[y * w + x] = s / n; }
    for (y = 0; y < h; y++) for (x = 0; x < w; x++) { s = 0; n = 0;
      for (k = -r; k <= r; k++) { var yy = y + k; if (yy >= 0 && yy < h) { s += tmp[yy * w + x]; n++; } } out[y * w + x] = s / n; }
    return out;
  }

  function render() {
    if (!src) return;
    var S = +$("sharp").value, C = +$("contrast").value, M = +$("mole").value;
    $("vS").textContent = S; $("vC").textContent = C; $("vM").textContent = M;
    if (showOrig) { ctx.putImageData(src, 0, 0); drawMarks(); return; }
    var w = src.width, h = src.height, d = src.data, n = w * h, i;
    var L = new Float32Array(n);
    for (i = 0; i < n; i++) L[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];
    var small = blurLum(L, w, h, 1);                       // シャープ用
    var big = blurLum(L, w, h, Math.max(4, Math.round(w / 60))); // 周りの肌の明るさ
    var out = ctx.createImageData(w, h), o = out.data;
    for (i = 0; i < n; i++) {
      var l = L[i];
      var nl = l + S * (l - small[i]);                     // アンシャープマスク
      nl = big[i] + (nl - big[i]) * (1 + C);               // 局所コントラスト
      var diff = big[i] - l; if (diff > 0) nl -= M * diff * (1 + diff / 40); // 周りより暗い点ほど強く暗く
      var ratio = l > 1 ? nl / l : 1;
      for (var c = 0; c < 3; c++) { var v = d[i*4+c] * ratio; o[i*4+c] = v < 0 ? 0 : v > 255 ? 255 : v; }
      o[i*4+3] = 255;
    }
    ctx.putImageData(out, 0, 0); drawMarks();
  }

  function drawMarks() {
    ctx.lineWidth = Math.max(2, cv.width / 300); ctx.strokeStyle = "#00e5ff";
    ctx.font = Math.max(14, cv.width / 40) + "px sans-serif"; ctx.fillStyle = "#00e5ff";
    marks.forEach(function (m, idx) {
      var b = m.bbox; if (!b || b.length < 4) return;
      var x = b[0] * cv.width, y = b[1] * cv.height, bw = (b[2] - b[0]) * cv.width, bh = (b[3] - b[1]) * cv.height;
      var cx = x + bw / 2, cy = y + bh / 2, r = Math.max(bw, bh) / 2 + 8;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillText(String(idx + 1), cx + r + 2, cy);
    });
  }

  ["sharp", "contrast", "mole"].forEach(function (id) { $(id).addEventListener("input", render); });
  var ob = $("orig");
  ["touchstart", "mousedown"].forEach(function (e) { ob.addEventListener(e, function (ev) { ev.preventDefault(); showOrig = true; render(); }); });
  ["touchend", "touchcancel", "mouseup", "mouseleave"].forEach(function (e) { ob.addEventListener(e, function () { if (showOrig) { showOrig = false; render(); } }); });

  $("ai").addEventListener("click", function () {
    if (!src) { st.textContent = "先に写真を選んでください"; return; }
    var key = localStorage.getItem("gemini_api_key");
    if (!key) { alert("先に上の欄にGemini APIキーを貼って「キーを保存」を押してください"); return; }
    localStorage.setItem("gemini_api_key", key.trim());
    st.textContent = "解析中…";
    marks = []; render(); // 前回の印を消してから調べる
    // 写真を「全体＋2×2の4分割（少し重ねる）」で調べ、小さいほくろの見落としを減らす
    var W = cv.width, H = cv.height, ov = 0.12;
    var tiles = [[0, 0, 1, 1]];
    for (var ty = 0; ty < 2; ty++) for (var tx = 0; tx < 2; tx++)
      tiles.push([Math.max(0, tx * 0.5 - ov), Math.max(0, ty * 0.5 - ov), Math.min(1, tx * 0.5 + 0.5 + ov), Math.min(1, ty * 0.5 + 0.5 + ov)]);
    var prompt = "あなたは皮膚科の画像所見を補助するアシスタントです。この画像の皮膚上にある、ほくろ（色素性母斑）を小さいもの・薄いものも含めて一つ残らず検出してください。周りの肌より暗い直径数ピクセル程度の点も対象です。毛穴、影、髪、眉、まつげ、目、鼻の穴、口は除外してください。JSONだけ返してください。形式: {\"features\":[{\"bbox\":[x_min,y_min,x_max,y_max],\"description\":\"位置の説明（例: 左頬の小さなほくろ）\",\"confidence\":0.9}]} bboxはこの画像の幅・高さに対する0〜1の正規化座標で左上が(0,0)。見つからなければ{\"features\":[]}。";
    var models = ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-2.5-flash"], modelIdx = 0;
    function tileB64(t) {
      var sx = t[0] * W, sy = t[1] * H, sw = (t[2] - t[0]) * W, sh = (t[3] - t[1]) * H;
      var sc = Math.min(2, 1600 / Math.max(sw, sh));
      var c = document.createElement("canvas"); c.width = Math.round(sw * sc); c.height = Math.round(sh * sc);
      c.getContext("2d").drawImage(cv, sx, sy, sw, sh, 0, 0, c.width, c.height);
      return c.toDataURL("image/jpeg", 0.92).split(",")[1];
    }
    function callTile(t) {
      var body = JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: tileB64(t) } }] }],
        generationConfig: { responseMimeType: "application/json", temperature: 0 } });
      function attempt() {
        var model = models[modelIdx];
        return fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
          method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key.trim() }, body: body
        }).then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); })
        .then(function (res) {
          var data = res.data;
          if (data.error) {
            if ((res.status === 404 || res.status === 429) && modelIdx + 1 < models.length) { modelIdx++; return attempt(); }
            throw new Error("エラー " + res.status + " (" + (data.error.status || "") + "): " + (data.error.message || ""));
          }
          var c = data.candidates && data.candidates[0];
          if (!c || !c.content || !c.content.parts) return [];
          var txt = c.content.parts.map(function (p) { return p.text || ""; }).join("").replace(/^```(json)?\s*/i, "").replace(/```\s*$/, "").trim();
          var f; try { f = JSON.parse(txt).features || []; } catch (pe) { return []; }
          // タイル内の座標を写真全体の座標に戻す
          return f.filter(function (m) { return m.bbox && m.bbox.length >= 4; }).map(function (m) {
            var tw = t[2] - t[0], th = t[3] - t[1], b = m.bbox;
            return { bbox: [t[0] + b[0] * tw, t[1] + b[1] * th, t[0] + b[2] * tw, t[1] + b[3] * th], description: m.description, confidence: m.confidence };
          });
        });
      }
      return attempt();
    }
    st.textContent = "解析中…（5回に分けて調べます）";
    var done = 0, all = [];
    var seq = Promise.resolve();
    tiles.forEach(function (t) {
      seq = seq.then(function () { return callTile(t); }).then(function (f) { all = all.concat(f); done++; st.textContent = "解析中… " + done + "/" + tiles.length; });
    });
    seq.then(function () {
      // 重なったタイルで同じほくろが二重に出たら1つにまとめる
      var merged = [];
      all.forEach(function (m) {
        var cx = (m.bbox[0] + m.bbox[2]) / 2, cy = (m.bbox[1] + m.bbox[3]) / 2;
        var dup = merged.some(function (n) {
          var nx = (n.bbox[0] + n.bbox[2]) / 2, ny = (n.bbox[1] + n.bbox[3]) / 2;
          return Math.abs(nx - cx) * W < 20 + (n.bbox[2] - n.bbox[0]) * W && Math.abs(ny - cy) * H < 20 + (n.bbox[3] - n.bbox[1]) * H;
        });
        if (!dup) merged.push(m);
      });
      marks = merged;
      var list = $("list"); list.innerHTML = "";
      marks.forEach(function (m, i) {
        var d = document.createElement("div"); d.className = "item";
        d.textContent = (i + 1) + ". " + (m.description || "ほくろ");
        list.appendChild(d);
      });
      st.textContent = marks.length + " 個のほくろに印をつけました（" + models[modelIdx] + "）";
      render();
    }).catch(function (e) { st.textContent = e.message.indexOf("エラー") === 0 ? e.message : "通信エラー: " + e.message; });
  });

  $("save").addEventListener("click", function () {
    if (!src) return;
    cv.toBlob(function (blob) {
      var file = new File([blob], "shatan-enhanced.jpg", { type: "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function () {});   // 共有シートから「画像を保存」
      } else {
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      }
    }, "image/jpeg", 0.92);
  });

  $("clearKey").addEventListener("click", function (e) { e.preventDefault(); localStorage.removeItem("gemini_api_key"); st.textContent = "APIキーを消しました"; });

  (function () {
    var kin = document.getElementById("apiKey"), ks = document.getElementById("keyStatus");
    function show() { ks.textContent = localStorage.getItem("gemini_api_key") ? "キー保存済み（変えるときは新しいキーを貼って保存）" : "キーがまだ保存されていません"; }
    document.getElementById("saveKey").addEventListener("click", function () {
      var v = kin.value.replace(/\s+/g, "");
      if (!v) { ks.textContent = "キーが空です"; return; }
      localStorage.setItem("gemini_api_key", v); kin.value = ""; show();
    });
    show();
  })();
})();
</script>
</body>
</html>

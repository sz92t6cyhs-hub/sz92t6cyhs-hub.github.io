<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>写探 補正 - ほくろを見やすく</title>
<style>
  :root { --bg:#12110f; --fg:#f4f0e8; --accent:#c44722; --muted:#8a8478; --card:#1c1a17; --border:#2e2b27; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; padding:20px; }
  .wrap { max-width:640px; margin:0 auto; }
  .wordmark { font-size:1.4rem; font-weight:700; letter-spacing:0.15em; margin-bottom:16px; }
  .wordmark span { color:var(--accent); }
  .pick { position:relative; overflow:hidden; display:block; text-align:center; background:var(--accent); font-weight:700; font-size:1.1rem; padding:22px; border-radius:4px; }
  .pick input { position:absolute; inset:0; width:100%; height:100%; opacity:0; font-size:100px; }
  canvas { display:block; width:100%; margin-top:16px; background:#000; border-radius:4px; }
  .row { margin-top:14px; }
  .row label { display:flex; justify-content:space-between; color:var(--muted); font-size:0.9rem; }
  input[type=range] { width:100%; }
  .btn { display:block; width:100%; margin-top:12px; background:var(--card); color:var(--fg); border:1px solid var(--border); font-size:1rem; font-weight:700; padding:14px; border-radius:4px; }
  .btn.main { background:var(--accent); border:none; }
  .status { margin-top:10px; color:var(--muted); font-size:0.9rem; min-height:1.2em; }
  .item { background:var(--card); border:1px solid var(--border); padding:10px 14px; margin-top:6px; font-size:0.9rem; }
  .note { margin-top:24px; color:var(--muted); font-size:0.75rem; line-height:1.6; }
  a { color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="wordmark">写<span>探</span> 補正</div>
  <label class="pick">写真を選ぶ<input id="file" type="file" accept="image/*"></label>
  <canvas id="cv"></canvas>
  <div class="row"><label>くっきり <span id="vS"></span></label><input id="sharp" type="range" min="0" max="3" step="0.1" value="1.5"></div>
  <div class="row"><label>コントラスト <span id="vC"></span></label><input id="contrast" type="range" min="0" max="2" step="0.05" value="0.6"></div>
  <div class="row"><label>ほくろ強調（暗い点を濃く） <span id="vM"></span></label><input id="mole" type="range" min="0" max="2" step="0.05" value="0.8"></div>
  <button class="btn" id="orig" type="button">押している間は元の写真</button>
  <button class="btn main" id="ai" type="button">Geminiでほくろに印をつける</button>
  <button class="btn" id="save" type="button">画像を保存</button>
  <div class="status" id="st"></div>
  <div id="list"></div>
  <p class="note">補正はすべてこのiPhoneのブラウザ内で行います。印つけだけはGeminiに画像を送ります。APIキーは自分で取得したものを入力し、この端末内にだけ保存されます。</p>
  <p class="note"><a href="https://sz92t6cyhs-hub.github.io/">写探に戻る</a> ／ <a href="#" id="clearKey">保存したAPIキーを消す</a></p>
</div>
<script>
(function () {
  var cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  var src = null, marks = [], showOrig = false;
  var $ = function (id) { return document.getElementById(id); };
  var st = $("st");

  $("file").addEventListener("change", function () {
    var f = this.files && this.files[0]; if (!f) return;
    var im = new Image();
    im.onload = function () {
      var max = 1600, s = Math.min(1, max / Math.max(im.width, im.height));
      cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      ctx.drawImage(im, 0, 0, cv.width, cv.height);
      src = ctx.getImageData(0, 0, cv.width, cv.height);
      marks = []; $("list").innerHTML = ""; render();
    };
    im.src = URL.createObjectURL(f);
  });

  // 3x3 ぼかし（グレー）
  function blurLum(L, w, h, r) {
    var tmp = new Float32Array(L.length), out = new Float32Array(L.length), x, y, k, s, n;
    for (y = 0; y < h; y++) for (x = 0; x < w; x++) { s = 0; n = 0;
      for (k = -r; k <= r; k++) { var xx = x + k; if (xx >= 0 && xx < w) { s += L[y * w + xx]; n++; } } tmp[y * w + x] = s / n; }
    for (y = 0; y < h; y++) for (x = 0; x < w; x++) { s = 0; n = 0;
      for (k = -r; k <= r; k++) { var yy = y + k; if (yy >= 0 && yy < h) { s += tmp[yy * w + x]; n++; } } out[y * w + x] = s / n; }
    return out;
  }

  function render() {
    if (!src) return;
    var S = +$("sharp").value, C = +$("contrast").value, M = +$("mole").value;
    $("vS").textContent = S; $("vC").textContent = C; $("vM").textContent = M;
    if (showOrig) { ctx.putImageData(src, 0, 0); drawMarks(); return; }
    var w = src.width, h = src.height, d = src.data, n = w * h, i;
    var L = new Float32Array(n);
    for (i = 0; i < n; i++) L[i] = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2];
    var small = blurLum(L, w, h, 1);                       // シャープ用
    var big = blurLum(L, w, h, Math.max(4, Math.round(w / 60))); // 周りの肌の明るさ
    var out = ctx.createImageData(w, h), o = out.data;
    for (i = 0; i < n; i++) {
      var l = L[i];
      var nl = l + S * (l - small[i]);                     // アンシャープマスク
      nl = big[i] + (nl - big[i]) * (1 + C);               // 局所コントラスト
      var diff = big[i] - l; if (diff > 0) nl -= M * diff; // 周りより暗い点をさらに暗く
      var ratio = l > 1 ? nl / l : 1;
      for (var c = 0; c < 3; c++) { var v = d[i*4+c] * ratio; o[i*4+c] = v < 0 ? 0 : v > 255 ? 255 : v; }
      o[i*4+3] = 255;
    }
    ctx.putImageData(out, 0, 0); drawMarks();
  }

  function drawMarks() {
    ctx.lineWidth = Math.max(2, cv.width / 300); ctx.strokeStyle = "#00e5ff";
    ctx.font = Math.max(14, cv.width / 40) + "px sans-serif"; ctx.fillStyle = "#00e5ff";
    marks.forEach(function (m, idx) {
      var b = m.bbox; if (!b || b.length < 4) return;
      var x = b[0] * cv.width, y = b[1] * cv.height, bw = (b[2] - b[0]) * cv.width, bh = (b[3] - b[1]) * cv.height;
      var cx = x + bw / 2, cy = y + bh / 2, r = Math.max(bw, bh) / 2 + 8;
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillText(String(idx + 1), cx + r + 2, cy);
    });
  }

  ["sharp", "contrast", "mole"].forEach(function (id) { $(id).addEventListener("input", render); });
  var ob = $("orig");
  ["touchstart", "mousedown"].forEach(function (e) { ob.addEventListener(e, function (ev) { ev.preventDefault(); showOrig = true; render(); }); });
  ["touchend", "touchcancel", "mouseup", "mouseleave"].forEach(function (e) { ob.addEventListener(e, function () { if (showOrig) { showOrig = false; render(); } }); });

  $("ai").addEventListener("click", function () {
    if (!src) { st.textContent = "先に写真を選んでください"; return; }
    var key = localStorage.getItem("gemini_api_key") || window.prompt("Gemini APIキーを入力（aistudio.google.com で取得）");
    if (!key) return;
    localStorage.setItem("gemini_api_key", key.trim());
    st.textContent = "解析中…";
    var b64 = cv.toDataURL("image/jpeg", 0.9).split(",")[1];
    var prompt = "この写真の皮膚上のほくろをすべて検出してください。JSONだけ返してください。形式: {\"features\":[{\"bbox\":[x_min,y_min,x_max,y_max],\"description\":\"位置の説明（例: 左頬の小さなほくろ）\",\"confidence\":0.9}]} bboxは画像の幅・高さに対する0〜1の正規化座標で左上が(0,0)。見つからなければ{\"features\":[]}。";
    var body = JSON.stringify({ contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: b64 } }] }],
      generationConfig: { responseMimeType: "application/json" } });
    var models = ["gemini-3.6-flash", "gemini-3.5-flash", "gemini-2.5-flash"];
    function tryModel(k) {
      var model = models[k];
      fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent", {
        method: "POST", headers: { "Content-Type": "application/json", "x-goog-api-key": key.trim() }, body: body
      }).then(function (r) { return r.json().then(function (data) { return { status: r.status, data: data }; }); })
      .then(function (res) {
        var data = res.data;
        if (data.error) {
          // モデルが使えない場合だけ次のモデルを試す
          if ((res.status === 404 || res.status === 429) && k + 1 < models.length) { tryModel(k + 1); return; }
          st.textContent = "エラー " + res.status + " (" + (data.error.status || "") + "): " + (data.error.message || "");
          return;
        }
        var c = data.candidates && data.candidates[0];
        if (!c || !c.content || !c.content.parts) {
          st.textContent = "Geminiが結果を返しませんでした（" + ((c && c.finishReason) || (data.promptFeedback && data.promptFeedback.blockReason) || "理由不明") + "）";
          return;
        }
        var t = c.content.parts.map(function (p) { return p.text || ""; }).join("").replace(/^```(json)?\s*/i, "").replace(/```\s*$/, "").trim();
        var parsed; try { parsed = JSON.parse(t); } catch (pe) { st.textContent = "結果の読み取りに失敗しました: " + t.slice(0, 120); return; }
        marks = parsed.features || [];
        var list = $("list"); list.innerHTML = "";
        marks.forEach(function (m, i) {
          var d = document.createElement("div"); d.className = "item";
          d.textContent = (i + 1) + ". " + (m.description || "ほくろ");
          list.appendChild(d);
        });
        st.textContent = marks.length + " 個のほくろに印をつけました（" + model + "）";
        render();
      }).catch(function (e) { st.textContent = "通信エラー: " + e.message + "（ネット接続か、ブラウザの通信制限の可能性）"; });
    }
    tryModel(0);
  });

  $("save").addEventListener("click", function () {
    if (!src) return;
    cv.toBlob(function (blob) {
      var file = new File([blob], "shatan-enhanced.jpg", { type: "image/jpeg" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file] }).catch(function () {});   // 共有シートから「画像を保存」
      } else {
        var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
      }
    }, "image/jpeg", 0.92);
  });

  $("clearKey").addEventListener("click", function (e) { e.preventDefault(); localStorage.removeItem("gemini_api_key"); st.textContent = "APIキーを消しました"; });
})();
</script>
</body>
</html>
